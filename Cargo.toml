[package]
name = "cocapn-health"
version = "0.1.0"
edition = "2021"
description = "Fleet service health checker with monitoring, alerting, and reporting — Rust port of cocapn-health"
license = "MIT"
keywords = ["health", "monitoring", "alerting", "fleet", "service"]
categories = ["network-programming", "web-programming"]
repository = "https://github.com/SuperInstance/cocapn-health-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
